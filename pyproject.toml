[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mc6809"
version = "0.1.0"
description = "Callback-driven Motorola 6809 / Hitachi 6309 CPU emulation core and tiny assembler"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "omikron"}]
classifiers = ["Programming Language :: Python :: 3"]

[project.scripts]
zeta2 = "zeta2.__main__:main"
zxspectrum = "zxspectrum.__main__:main"

[project.optional-dependencies]
spectrum = ["pygame>=2.5,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
